<svg xmlns="http://www.w3.org/2000/svg" width="380" height="92" viewBox="0 0 380 92" role="img" aria-label="Letöltés Windowsra">
  <title>Letöltés Windowsra</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b7bff"/>
      <stop offset="1" stop-color="#1450c8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="6" y="6" width="368" height="80" rx="18"/></clipPath>
  </defs>

  <!-- pulzáló fény a gomb körül -->
  <rect x="3" y="3" width="374" height="86" rx="21" fill="none" stroke="#5aa2ff" stroke-width="4">
    <animate attributeName="opacity" values="0.15;0.85;0.15" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="2;6;2" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <!-- test -->
  <rect x="6" y="6" width="368" height="80" rx="18" fill="url(#bg)"/>
  <rect x="6.5" y="6.5" width="367" height="79" rx="17.5" fill="none" stroke="#fff" stroke-opacity="0.18"/>

  <!-- átfutó csillanás -->
  <g clip-path="url(#clip)">
    <rect x="-120" y="-10" width="70" height="120" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-120;520;520" keyTimes="0;0.55;1" dur="3.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ikon -->
  <g transform="translate(26 22)" fill="#fff">
    <rect x="0" y="2" width="19" height="19" rx="2"/><rect x="22" y="0" width="22" height="21" rx="2"/><rect x="0" y="24" width="19" height="19" rx="2"/><rect x="22" y="24" width="22" height="22" rx="2"/>
  </g>

  <!-- szöveg -->
  <text x="84" y="44" fill="#fff" font-family="'Segoe UI','SF Pro Display',-apple-system,Helvetica,Arial,sans-serif" font-size="24" font-weight="700">Letöltés Windowsra</text>
  <text x="84" y="65" fill="#fff" fill-opacity="0.85" font-family="'Segoe UI','SF Pro Text',-apple-system,Helvetica,Arial,sans-serif" font-size="13">Telepítő · .exe</text>

  <!-- pattogó letöltés-nyíl -->
  <g transform="translate(326 28)" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -3;0 5;0 -3" dur="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <path d="M14 2 V26"/>
      <path d="M4 17 L14 27 L24 17"/>
    </g>
    <path d="M2 36 H26" stroke-opacity="0.9"/>
  </g>
</svg>
